[build]
  base = "outputs"
  publish = "."
  command = ""

[build.processing]
  skip_processing = false

[[redirects]]
  from = "/*"
  to = "https://vitalcare-pro.web.app/:splat"
  status = 302
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
